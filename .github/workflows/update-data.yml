name: Actualizar datos

on:
  workflow_dispatch:
  schedule:
    # 08:17, 11:17, 14:17, 17:17 y 20:17 de Argentina, de lunes a viernes.
    - cron: "17 11-23/3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e .
      - name: Actualizar
        run: |
          python -m inta_forrajes.cli init-db
          python -m inta_forrajes.cli import-manual
          python -m inta_forrajes.cli update --source bcra
          python -m inta_forrajes.cli update --source a3
          python -m inta_forrajes.cli publish-public
      - name: Versionar datos públicos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/latest.json
          if git diff --cached --quiet; then
            echo "No hay datos públicos nuevos"
          else
            git commit -m "data: actualizar fuentes públicas"
            git push
          fi
